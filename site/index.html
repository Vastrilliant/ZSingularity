<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="color-scheme" content="dark only">
<meta name="theme-color" content="#000000">
<title>ZSingularity Injector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --accent: #f2deff;
  --accent-soft: #d5c3e0;
  --text: #ffffff;
  --text-muted: #d6d6d6;
  --border: #e4daf0;
  --glow: rgba(242, 222, 255, 0.25);
  --err: #ff2b2b;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; border-radius: 0; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.7; overflow-x: hidden;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.wrap { max-width: 640px; margin: 0 auto; padding: 72px 24px 90px; opacity: 0; transform: translateY(10px); animation: enter 1s ease 0.1s forwards; }
@keyframes enter { to { opacity: 1; transform: translateY(0); } }
header { text-align: center; }
h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(36px, 8vw, 50px); color: var(--accent); margin: 0; letter-spacing: 0.5px; line-height: 1.15; }
.tag { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--text-muted); letter-spacing: 1px; margin: 4px 0 0; }
.divider { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 44px 0; }
.divider::before, .divider::after { content: ''; height: 1px; flex: 1; background: var(--text); }
.divider span { font-size: 15px; letter-spacing: 2px; }
section { margin: 0 0 8px; }
h2 { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 2.5px; color: var(--accent); text-align: center; margin: 0 0 22px; }
button, .drop { font-family: var(--sans); outline: none; }
.btn {
  appearance: none; -webkit-appearance: none; background: transparent; color: var(--text); border: 1px solid var(--border);
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; padding: 12px 18px; cursor: pointer; transition: all 0.3s ease;
  width: 100%;
}
.btn.big { font-size: 13px; letter-spacing: 2.5px; padding: 14px 32px; }
.btn:disabled { opacity: 0.3; cursor: default; }
@media (hover: hover) {
  .btn:not(:disabled):hover, .drop:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); box-shadow: 0 0 15px var(--glow); }
}
.btn:not(:disabled):active { background: var(--accent); color: var(--bg); border-color: var(--accent); box-shadow: 0 0 15px var(--glow); }
.ver { margin-top: 16px; font-size: 13px; color: var(--accent-soft); font-style: italic; text-align: center; min-height: 22px; }
.drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px;
  border: 1px solid var(--border); padding: 30px 14px; cursor: pointer; transition: all 0.3s ease; background: transparent;
}
.drop strong { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 2.5px; color: var(--text); transition: color 0.3s ease; }
.drop span { color: var(--text-muted); font-size: 12px; letter-spacing: 1px; word-break: break-all; transition: color 0.3s ease; }
.drop.over { border-color: var(--accent); box-shadow: 0 0 15px var(--glow); }
.drop.has-file { border-color: var(--accent); }
.drop.has-file strong { color: var(--accent); }
@media (hover: hover) { .drop:hover strong, .drop:hover span { color: var(--bg); } }
input[type=file] { display: none; }
.opt { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 18px; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; cursor: pointer; }
.opt input { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border: 1px solid var(--border); background: transparent; margin: 0; cursor: pointer; transition: all 0.2s ease; }
.opt input:checked { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--glow); }
.actions { margin-top: 36px; display: flex; flex-direction: column; gap: 12px; }
.bar { height: 2px; background: #2a2a2a; margin-top: 4px; }
.bar > i { display: block; height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 10px var(--glow); transition: width 0.12s linear; }
.stage { font-size: 12px; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 12px; min-height: 20px; text-align: center; }
.log { font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-muted); white-space: pre-wrap; margin-top: 12px; max-height: 320px; overflow: auto; border: 1px solid #2a2a2a; padding: 10px 12px; }
.log:empty { display: none; }
.log .e { color: var(--err); } .log .w { color: var(--accent-soft); } .log .k { color: var(--accent); }
.meta { font-size: 13px; color: var(--accent-soft); text-align: center; word-break: break-all; font-style: italic; margin-bottom: 16px; }
.note { font-size: 12px; color: var(--text-muted); text-align: center; letter-spacing: 0.5px; margin-top: 16px; line-height: 1.6; }
.hidden { display: none !important; }
.fail .stage { color: var(--err); }
.done .bar { display: none; }
.row { display: flex; gap: 12px; margin-top: 18px; align-items: stretch; }
.row .pop { position: relative; flex: 1 1 0; min-width: 0; }
.row .pop .btn { padding: 13px 4px; font-size: 11px; letter-spacing: 1.4px; white-space: nowrap; }
.row .inject { flex: 1.25 1 0; min-width: 0; padding: 13px 4px; font-size: 11px; letter-spacing: 1.4px; white-space: nowrap; }
.row .btn.open { background: var(--accent); color: var(--bg); border-color: var(--accent); box-shadow: 0 0 15px var(--glow); }
.menu { position: absolute; left: 0; top: calc(100% + 6px); min-width: 100%; width: max-content; max-width: 78vw; max-height: 244px; overflow-y: auto; background: #000; border: 1px solid var(--accent); box-shadow: 0 0 15px var(--glow); z-index: 20; }
.menu button { display: block; width: 100%; text-align: left; background: transparent; color: var(--text); border: 0; border-bottom: 1px solid #2a2a2a; padding: 12px 14px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }
.menu button:last-child { border-bottom: 0; }
.menu button.sel { color: var(--accent); }
.menu button:disabled { opacity: 0.3; cursor: default; }
@media (hover: hover) { .menu button:not(:disabled):hover { background: var(--accent); color: var(--bg); } }
.menu button:not(:disabled):active { background: var(--accent); color: var(--bg); }
@media (max-width: 380px) { .row { flex-wrap: wrap; } .row .inject { flex: 1 1 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ZSingularity</h1>
    <p class="tag">on-device injector</p>
  </header>

  <div class="divider"><span>§</span></div>

  <section>
    <h2>Decrypted Game IPA</h2>
    <label class="drop" id="drop">
      <strong id="pickTitle">「 Choose .ipa 」</strong>
      <input type="file" id="file">
    </label>
    <div class="row">
      <div class="pop"><button type="button" class="btn" id="channelBtn">「 Channel 」</button></div>
      <div class="pop hidden" id="versionPop"><button type="button" class="btn" id="versionBtn">「 Version 」</button></div>
      <button class="btn inject" id="go" disabled>「 Inject 」</button>
    </div>
    <div class="ver" id="ver">Loading…</div>
  </section>

  <section id="progressCard" class="hidden">
    <div class="divider"><span>§</span></div>
    <h2>Progress</h2>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stage" id="stage"></div>
    <div class="log" id="log"></div>
  </section>

  <section id="result" class="hidden">
    <div class="divider"><span>§</span></div>
    <h2>Finished</h2>
    <div class="meta" id="outMeta"></div>
    <div class="actions" style="margin-top:0">
      <button class="btn big" id="dl">「 Save IPA 」</button>
    </div>
  </section>
</div>

<script type="module">
import { inject } from "./js/inject.js";

const $ = (id) => document.getElementById(id);
const state = {
  channel: "release", versions: [], version: null, manifests: {}, nightly: null, loaded: false, loadError: null,
  file: null, t0: 0, busy: false, outUrl: null, outBlob: null, outName: "",
};

const FALLBACK_REPO = "vastrilliant/ZSingularity";
const DYLIB_ASSET = "ZSingularity.dylib";
const APPEX_ASSET = "ZSRamDonor.appex.zip";

function repoSlug() {
  const host = location.hostname.match(/^([^.]+)\.github\.io$/i);
  const first = location.pathname.split("/").filter(Boolean)[0];
  return host && first ? host[1] + "/" + first : FALLBACK_REPO;
}

const REPO = repoSlug();
const API = "https://api.github.com/repos/" + REPO;

function fmtSize(n) {
  if (n >= 1073741824) return (n / 1073741824).toFixed(2) + " GB";
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
  return Math.max(1, Math.round(n / 1024)) + " KB";
}

function stamp() {
  const t = state.t0 ? (performance.now() - state.t0) / 1000 : 0;
  return "[+" + t.toFixed(2).padStart(6, " ") + "s] ";
}

function log(msg, cls) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = stamp() + msg;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

function current() {
  return state.channel === "nightly" ? state.nightly : state.manifests[state.version];
}

function refresh() {
  const m = current();
  const name = state.channel === "nightly" ? "Nightly" : "Release";
  if (m) $("ver").textContent = name + " \u00b7 " + m.version + (m.build ? " \u00b7 build " + m.build : "");
  else if (state.loadError) $("ver").textContent = state.loadError;
  else if (state.loaded) $("ver").textContent = "No builds are published yet.";
  else $("ver").textContent = "Loading\u2026";
  $("versionPop").classList.toggle("hidden", !(state.channel === "release" && state.versions.length));
  $("channelBtn").disabled = state.busy;
  $("versionBtn").disabled = state.busy;
  $("go").disabled = !(m && state.file) || state.busy;
}

async function githubFetch(url, init) {
  const r = await fetch(url, init);
  if ((r.status === 403 || r.status === 429) && r.headers.get("x-ratelimit-remaining") === "0") {
    const reset = Number(r.headers.get("x-ratelimit-reset")) * 1000;
    const mins = reset ? Math.max(1, Math.ceil((reset - Date.now()) / 60000)) : 0;
    throw new Error("GitHub's rate limit was reached, try again " + (mins ? "in about " + mins + " min." : "later."));
  }
  return r;
}

function assetInfo(a) {
  const m = /^sha256:([0-9a-f]{64})$/i.exec(a.digest || "");
  return { file: a.name, url: a.url, size: a.size, sha256: m ? m[1].toLowerCase() : "" };
}

function manifestFor(rel, channel, version, commit) {
  const dylib = (rel.assets || []).find((a) => a.name === DYLIB_ASSET && a.size > 0);
  if (!dylib) return null;
  const appex = rel.assets.find((a) => a.name === APPEX_ASSET && a.size > 0);
  const build = (/build (\d+)/.exec(rel.body || "") || [])[1] || null;
  return { channel, version, build, commit: commit || null, dylib: assetInfo(dylib), appex: appex ? assetInfo(appex) : null };
}

async function sourceVersion(ref) {
  for (const r of [ref, "main"]) {
    if (!r) continue;
    try {
      const res = await fetch("https://raw.githubusercontent.com/" + REPO + "/" + r + "/Core/Version.h", { cache: "no-cache" });
      if (!res.ok) continue;
      const text = await res.text();
      const part = (n) => (new RegExp("#define ZS_VERSION_" + n + " (\\d+)").exec(text) || [])[1];
      if (part("MAJOR") !== undefined && part("MINOR") !== undefined && part("PATCH") !== undefined) return part("MAJOR") + "." + part("MINOR") + "." + part("PATCH");
    } catch (e) {}
  }
  return "nightly";
}

async function loadAll() {
  try {
    const r = await githubFetch(API + "/releases?per_page=100", { headers: { Accept: "application/vnd.github+json" }, cache: "no-cache" });
    if (!r.ok) throw new Error("GitHub returned " + r.status + " while listing releases.");
    const releases = await r.json();
    let nightlyRel = null;
    const manifests = {};
    for (const rel of releases) {
      if (rel.draft) continue;
      if (rel.tag_name === "nightly") {
        nightlyRel = nightlyRel || rel;
        continue;
      }
      if (rel.prerelease) continue;
      const version = rel.tag_name.replace(/^v/, "");
      const m = manifestFor(rel, "release", version, "");
      if (m && !manifests[version]) manifests[version] = m;
    }
    state.manifests = manifests;
    state.versions = Object.keys(manifests).sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
    state.version = state.versions[0] || null;
    if (nightlyRel) {
      const commit = nightlyRel.target_commitish || "";
      state.nightly = manifestFor(nightlyRel, "nightly", await sourceVersion(commit), commit);
    }
    if (!state.versions.length && state.nightly) state.channel = "nightly";
  } catch (e) {
    state.loadError = e && e.message ? e.message : "Could not reach GitHub.";
  }
  state.loaded = true;
  refresh();
}

let openMenu = null;

function closeMenu() {
  if (!openMenu) return;
  openMenu.el.remove();
  openMenu.btn.classList.remove("open");
  openMenu = null;
}

function showMenu(btn, items, selected, onPick) {
  if (openMenu && openMenu.btn === btn) { closeMenu(); return; }
  closeMenu();
  const el = document.createElement("div");
  el.className = "menu";
  for (const it of items) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = (it.value === selected ? "\u00a7 " : "") + it.label;
    if (it.value === selected) b.className = "sel";
    b.disabled = !!it.disabled;
    b.addEventListener("click", () => { closeMenu(); onPick(it.value); });
    el.appendChild(b);
  }
  btn.parentElement.appendChild(el);
  btn.classList.add("open");
  openMenu = { el, btn };
}

document.addEventListener("pointerdown", (e) => {
  if (openMenu && !openMenu.el.contains(e.target) && !openMenu.btn.contains(e.target)) closeMenu();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

$("channelBtn").addEventListener("click", () => {
  showMenu($("channelBtn"), [
    { value: "release", label: "Release", disabled: !state.versions.length },
    { value: "nightly", label: "Nightly", disabled: !state.nightly },
  ], state.channel, (v) => { state.channel = v; refresh(); });
});

$("versionBtn").addEventListener("click", () => {
  showMenu($("versionBtn"), state.versions.map((v) => ({ value: v, label: v })), state.version, (v) => {
    state.version = v;
    refresh();
  });
});

function setFile(f) {
  state.file = f || null;
  $("pickTitle").textContent = f ? f.name : "\u300c Choose .ipa \u300d";
  $("drop").classList.toggle("has-file", !!f);
  refresh();
}

$("file").addEventListener("change", (e) => setFile(e.target.files[0]));
const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
});

async function sha256Hex(buf) {
  const h = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

async function fetchVerified(asset) {
  const t = performance.now();
  log("GET " + asset.url);
  const r = await githubFetch(asset.url, { headers: { Accept: "application/octet-stream" }, cache: "no-store" });
  log("  HTTP " + r.status + " " + r.statusText + " \u00b7 type " + (r.headers.get("content-type") || "?") + " \u00b7 length " + (r.headers.get("content-length") || "?"));
  if (r.redirected) log("  served from " + new URL(r.url).host);
  if (!r.ok) throw new Error("Could not download " + asset.file + " (" + r.status + ")");
  const buf = await r.arrayBuffer();
  log("  received " + fmtSize(buf.byteLength) + " (" + buf.byteLength + " bytes) in " + (performance.now() - t).toFixed(0) + " ms");
  if (asset.size && buf.byteLength !== asset.size) throw new Error("Size mismatch for " + asset.file + ": expected " + asset.size + " bytes, got " + buf.byteLength + ".");
  if (asset.sha256) {
    const t2 = performance.now();
    const got = await sha256Hex(buf);
    log("  sha256 expected " + asset.sha256);
    log("  sha256 computed " + got + " (" + (performance.now() - t2).toFixed(0) + " ms)");
    if (got !== asset.sha256) throw new Error("Checksum mismatch for " + asset.file + ". The release may have been replaced while downloading, try again.");
  } else log("  no checksum published for this asset, skipping verification", "w");
  return buf;
}

function reset() {
  if (state.outUrl) URL.revokeObjectURL(state.outUrl);
  state.outUrl = null;
  state.outBlob = null;
  $("result").classList.add("hidden");
  $("log").textContent = "";
  $("barFill").style.width = "0%";
  $("stage").textContent = "";
  $("progressCard").classList.remove("hidden");
  $("progressCard").classList.remove("fail");
  $("progressCard").classList.remove("done");
}

const STAGE_SPAN = { "Reading IPA": [0, 0.05], "Patching Info.plist": [0.05, 0.08], "Patching executable": [0.08, 0.7], "Writing IPA": [0.7, 1], Done: [1, 1] };

$("go").addEventListener("click", async () => {
  const m = current();
  if (!m || !state.file) return;
  closeMenu();
  reset();
  state.busy = true;
  refresh();
  let lock = null;
  try { lock = await navigator.wakeLock?.request("screen"); } catch (e) {}
  const t0 = performance.now();
  state.t0 = t0;
  try {
    $("stage").textContent = "Downloading tweak payload";
    log("Environment: " + navigator.userAgent);
    log("Wake lock: " + (lock ? "held" : "unavailable") + " \u00b7 crypto.subtle: " + (crypto && crypto.subtle ? "yes" : "NO") + " \u00b7 deviceMemory: " + (navigator.deviceMemory || "?") + " GB \u00b7 cores: " + (navigator.hardwareConcurrency || "?"));
    log("Input: " + state.file.name + " \u00b7 " + fmtSize(state.file.size) + " (" + state.file.size + " bytes) \u00b7 type " + (state.file.type || "unknown"));
    log("Channel: " + state.channel + " \u00b7 repo " + REPO);
    log("Manifest: " + JSON.stringify(m));
    log("Fetching " + m.dylib.file + " (" + m.version + (m.build ? ", build " + m.build : "") + ")");
    const dylib = new Uint8Array(await fetchVerified(m.dylib));
    let appex = null;
    if (m.appex) {
      appex = new Blob([await fetchVerified(m.appex)]);
      log("Fetched " + m.appex.file + " (" + fmtSize(appex.size) + ")");
    } else log("No extension in this build, skipping embed");
    log("Checksums OK", "k");
    log("Payload dylib: " + fmtSize(dylib.length) + " (" + dylib.length + " bytes)");
    let lastStage = "";
    let stageT = performance.now();
    let lastPct = -1;
    const res = await inject(state.file, { dylib, appex }, {
      onLog: (msg, cls) => log("  " + msg, cls),
      onProgress(stage, f) {
        const [a, b] = STAGE_SPAN[stage] || [0, 1];
        $("barFill").style.width = Math.round((a + (b - a) * f) * 100) + "%";
        if (stage !== lastStage) {
          if (lastStage) log("  " + lastStage + " finished in " + (performance.now() - stageT).toFixed(0) + " ms");
          lastStage = stage;
          stageT = performance.now();
          lastPct = -1;
          $("stage").textContent = stage + "\u2026";
          log(stage);
        } else {
          const pct = Math.floor(f * 4) * 25;
          if (pct > lastPct && pct > 0 && pct < 100) { lastPct = pct; log("  " + stage + " " + pct + "%"); }
        }
      },
    });
    log("  " + lastStage + " finished in " + (performance.now() - stageT).toFixed(0) + " ms");
    for (const w of res.warnings) log(w, "w");
    state.outBlob = res.blob;
    state.outName = "LC" + res.gameVersion + "\u2014ZS" + m.version + ".ipa";
    state.outUrl = URL.createObjectURL(res.blob);
    $("stage").textContent = "Done in " + ((performance.now() - t0) / 1000).toFixed(1) + "s";
    log("Output blob: " + fmtSize(res.blob.size) + " (" + res.blob.size + " bytes) \u00b7 extension embedded: " + res.embeddedAppex + " \u00b7 already injected: " + res.alreadyInjected);
    log("Game " + res.gameVersion + " \u00b7 " + res.arch.join("+") + " \u00b7 " + res.appId, "k");
    $("outMeta").textContent = state.outName + " \u00b7 " + fmtSize(res.blob.size);
    $("result").classList.remove("hidden");
    $("progressCard").classList.add("done");
  } catch (err) {
    console.error(err);
    $("stage").textContent = "Failed";
    $("progressCard").classList.add("fail");
    log(err && err.message ? err.message : String(err), "e");
    if (err && err.name) log("Error type: " + err.name, "e");
    if (err && err.stack) log(String(err.stack), "e");
  } finally {
    try { await lock?.release(); } catch (e) {}
    state.busy = false;
    refresh();
  }
});

$("dl").addEventListener("click", () => {
  if (!state.outUrl) return;
  const a = document.createElement("a");
  a.href = state.outUrl;
  a.download = state.outName;
  document.body.appendChild(a);
  a.click();
  a.remove();
});

loadAll();
</script>
</body>
</html>
