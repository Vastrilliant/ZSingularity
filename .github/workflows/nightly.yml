name: Build Nightly release

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'Documentation/**'
      - 'README.md'
      - 'assets/**'
      - '.github/workflows/**'
      - 'demo/**'
      - 'site/**'
      - '.gitattributes'
      - 'scripts/**'

env:
  LZ4_REF: v1.10.0
  ASTCENC_REF: 4.8.0

jobs:
  nightly:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve iOS SDK path
        id: sdk
        run: echo "path=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_OUTPUT"

      - name: Cache LZ4 reference library
        id: lz4-cache
        uses: actions/cache@v4
        with:
          path: |
            lz4.h
            lz4.c
            lz4hc.h
            lz4hc.c
            lz4-checksums.txt
          key: lz4-${{ env.LZ4_REF }}

      - name: Fetch LZ4 reference library
        if: steps.lz4-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/lz4/lz4/${LZ4_REF}/lib"
          for f in lz4.h lz4.c lz4hc.h lz4hc.c; do
            curl -fsSL "${BASE}/${f}" -o "$f"
          done
          shasum -a 256 lz4.h lz4.c lz4hc.h lz4hc.c > lz4-checksums.txt
          shasum -a 256 -c lz4-checksums.txt

      - name: Verify cached LZ4 checksums
        if: steps.lz4-cache.outputs.cache-hit == 'true'
        run: shasum -a 256 -c lz4-checksums.txt

      - name: Cache astcenc source
        id: astc-cache
        if: hashFiles('astcenc/astcenc.h') == ''
        uses: actions/cache@v4
        with:
          path: astcenc
          key: astcenc-${{ env.ASTCENC_REF }}

      - name: Fetch astcenc source
        if: hashFiles('astcenc/astcenc.h') == ''
        run: |
          set -euo pipefail
          if [[ -f astcenc/checksums.txt ]]; then
            (cd astcenc && shasum -a 256 -c checksums.txt)
            exit 0
          fi
          curl -fsSL --retry 3 --retry-all-errors "https://github.com/ARM-software/astc-encoder/archive/refs/tags/${ASTCENC_REF}.tar.gz" -o astcenc.tar.gz
          mkdir -p astcenc-src astcenc
          tar -xzf astcenc.tar.gz -C astcenc-src --strip-components=1
          cp astcenc-src/Source/astcenc*.h astcenc-src/Source/astcenc_*.cpp astcenc/
          cp astcenc-src/LICENSE.txt astcenc/
          (cd astcenc && shasum -a 256 *.h *.cpp > checksums.txt)

      - name: Compile astcenc
        run: |
          set -euo pipefail
          mkdir -p astcenc-obj
          for source in astcenc/astcenc_*.cpp; do
            xcrun -sdk iphoneos clang++ \
              -c \
              -std=c++14 \
              -O3 \
              -fno-strict-aliasing \
              -isysroot "${{ steps.sdk.outputs.path }}" \
              -arch arm64 \
              -miphoneos-version-min=15.0 \
              -DASTCENC_NEON=1 \
              -DASTCENC_SSE=0 \
              -DASTCENC_AVX=0 \
              -DASTCENC_POPCNT=0 \
              -DASTCENC_F16C=0 \
              -DASTCENC_SVE=0 \
              -Iastcenc \
              "$source" \
              -o "astcenc-obj/$(basename "${source%.cpp}").o"
          done

      - name: Compile Metal transcoder
        run: |
          set -euo pipefail
          xcrun -sdk iphoneos metal -c -O3 -std=metal3.0 -target air64-apple-ios15.0 Mods/Transcoder/Astc.metal -o Astc.air
          xcrun -sdk iphoneos metallib Astc.air -o Astc.metallib

      - name: Compile ASTC encoder
        run: |
          set -euo pipefail
          clang \
            -c \
            -std=gnu++17 \
            -O3 \
            -fno-strict-aliasing \
            -fobjc-arc \
            -fmodules \
            -isysroot "${{ steps.sdk.outputs.path }}" \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -I. -IDiagnostics -IMods/Transcoder -Iastcenc \
            Mods/Transcoder/Astc.mm \
            -o Astc.o

      - name: Compile Crunch decoder
        run: |
          set -euo pipefail
          clang \
            -c \
            -std=gnu++17 \
            -O3 \
            -fno-strict-aliasing \
            -fobjc-arc \
            -fmodules \
            -isysroot "${{ steps.sdk.outputs.path }}" \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -I. -IDiagnostics -IMods/Transcoder \
            Mods/Transcoder/Crunch.mm \
            -o Crunch.o

      - name: Compile tweak dylib
        run: |
          clang \
            -dynamiclib \
            -O3 \
            -fobjc-arc \
            -fmodules \
            -Wno-nullability-completeness \
            -Wno-deprecated-declarations \
            -Wno-protocol \
            -Wno-objc-protocol-method-implementation \
            -isysroot "${{ steps.sdk.outputs.path }}" \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -DZS_BUILD_NUMBER=${{ github.run_number }} \
            -DZS_BUILD_CHANNEL=nightly \
            -DZS_BUILD_BRANCH='"${{ github.ref_name }}"' \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework Metal \
            -framework CoreText \
            -framework ImageIO \
            -framework UniformTypeIdentifiers \
            -framework PhotosUI \
            -framework Security \
            -framework CoreLocation \
            -framework WebKit \
            -framework AVFoundation \
            -framework CoreMedia \
            -framework CoreVideo \
            -framework VideoToolbox \
            -lcompression \
            -lc++ \
            -stdlib=libc++ \
            -install_name "@rpath/ZSingularity.dylib" \
            -Wl,-ld_classic \
            -Wl,-sectcreate,__DATA,__zstips,Resources/tips.json \
            -Wl,-sectcreate,__DATA,__zsastcmetal,Astc.metallib \
            -I. \
            -ICore -ICore/RamBypass -IUI/Core -IUI/Sections -IUI/Components -IUI/Misc -IUI/Docs -IMods -IMods/BundleTools -IMods/Transcoder -INetwork -IDiagnostics -IResources -INotifications \
            Mods/BundleTools/UnityBundleTools.m \
            Mods/BundleTools/AssetExplorer.m \
            Core/IL2CppIntrospection.m \
            Mods/Dumper/Dumper.m \
            Mods/Dumper/ScriptDump.m \
            Mods/Dumper/BinaryDiff.m \
            Core/DumpTypeRegistry.m \
            Core/Engine.m \
            Core/Hook.m \
            Core/Rebind.m \
            Core/RamBypass/RamDonor.m \
            Core/RamBypass/DonatedHeap.m \
            Diagnostics/Diagnostics.m \
            Mods/Mods.m \
            Mods/Transcoder/Transcoder.m \
            Mods/Transcoder/TexComp.m \
            Crunch.o \
            Astc.o \
            astcenc-obj/*.o \
            Network/PatchManifestNetwork.m \
            Network/Updater.m \
            UI/*/*.m \
            lz4.c \
            lz4hc.c \
            -o ZSingularity.dylib

      - name: Ad-hoc codesign
        run: codesign -f -s - ZSingularity.dylib

      - name: Verify architecture
        run: lipo -info ZSingularity.dylib

      - name: Compile memory donor extension
        run: |
          set -euo pipefail
          rm -rf ZSRamDonor.appex ZSRamDonor.appex.zip
          mkdir -p ZSRamDonor.appex
          clang \
            -O2 \
            -fobjc-arc \
            -fmodules \
            -fapplication-extension \
            -isysroot "${{ steps.sdk.outputs.path }}" \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -framework Foundation \
            -Wl,-e,_NSExtensionMain \
            -ICore/RamBypass \
            Extension/ZSRamDonor/main.m \
            -o ZSRamDonor.appex/ZSRamDonor
          cp Extension/ZSRamDonor/Info.plist ZSRamDonor.appex/Info.plist
          codesign -f -s - ZSRamDonor.appex
          ditto -c -k --keepParent ZSRamDonor.appex ZSRamDonor.appex.zip

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          
          # Delete existing nightly release and wait for completion
          if gh release view nightly --repo "$REPO" > /dev/null 2>&1; then
            gh release delete nightly --repo "$REPO" --yes --cleanup-tag
            sleep 2  # Wait for API to process deletion
          fi
          
          # Create new nightly release
          gh release create nightly ZSingularity.dylib ZSRamDonor.appex.zip \
            --repo "$REPO" \
            --title "Nightly build ${{ github.run_number }}" \
            --notes "Automated nightly build ${{ github.run_number }} (commit ${{ github.sha }})." \
            --prerelease \
            --target "${{ github.sha }}"
