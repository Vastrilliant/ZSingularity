name: Build Nightly release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'Documentation/**'
      - 'README.md'
      - 'assets/**'
      - '.github/workflows/**'
      - 'demo/**'

env:
  LZ4_REF: v1.10.0
  ASTCENC_REF: 5.7.0

jobs:
  nightly:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve iOS SDK path
        id: sdk
        run: echo "path=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_OUTPUT"

      - name: Cache LZ4 reference library
        id: lz4-cache
        uses: actions/cache@v4
        with:
          path: |
            lz4.h
            lz4.c
            lz4hc.h
            lz4hc.c
            lz4-checksums.txt
          key: lz4-${{ env.LZ4_REF }}

      - name: Fetch LZ4 reference library
        if: steps.lz4-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/lz4/lz4/${LZ4_REF}/lib"
          for f in lz4.h lz4.c lz4hc.h lz4hc.c; do
            curl -fsSL "${BASE}/${f}" -o "$f"
          done
          shasum -a 256 lz4.h lz4.c lz4hc.h lz4hc.c > lz4-checksums.txt
          shasum -a 256 -c lz4-checksums.txt

      - name: Verify cached LZ4 checksums
        if: steps.lz4-cache.outputs.cache-hit == 'true'
        run: shasum -a 256 -c lz4-checksums.txt

      - name: Cache astcenc sources
        id: astcenc-cache
        uses: actions/cache@v4
        with:
          path: |
            astcenc-src
            astcenc-checksums.txt
          key: astcenc-${{ env.ASTCENC_REF }}

      - name: Fetch astcenc sources
        if: steps.astcenc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p astcenc-src
          curl -fsSL "https://github.com/ARM-software/astc-encoder/archive/refs/tags/${ASTCENC_REF}.tar.gz" -o astcenc.tar.gz
          tar -xzf astcenc.tar.gz --strip-components=1 -C astcenc-src --include '*/Source/astcenc*'
          rm astcenc.tar.gz
          shasum -a 256 astcenc-src/Source/astcenc*.h astcenc-src/Source/astcenc*.cpp > astcenc-checksums.txt
          shasum -a 256 -c astcenc-checksums.txt

      - name: Verify cached astcenc checksums
        if: steps.astcenc-cache.outputs.cache-hit == 'true'
        run: shasum -a 256 -c astcenc-checksums.txt

      - name: Compile astcenc
        run: |
          set -euo pipefail
          mkdir -p astcenc-obj
          for f in astcenc-src/Source/astcenc_*.cpp; do
            clang++ -c -O3 -std=c++14 -stdlib=libc++ -ffp-contract=off -fvisibility=hidden \
              -isysroot "${{ steps.sdk.outputs.path }}" -arch arm64 -miphoneos-version-min=15.0 \
              -DASTCENC_NEON=1 -DASTCENC_SSE=0 -DASTCENC_AVX=0 -DASTCENC_POPCNT=0 -DASTCENC_F16C=0 -DASTCENC_SVE=0 \
              "$f" -o "astcenc-obj/$(basename "$f" .cpp).o"
          done

      - name: Compile tweak dylib
        run: |
          clang \
            -dynamiclib \
            -O2 \
            -fobjc-arc \
            -fmodules \
            -isysroot "${{ steps.sdk.outputs.path }}" \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -DZS_BUILD_NUMBER=${{ github.run_number }} \
            -DZS_BUILD_CHANNEL=nightly \
            -DZS_BUILD_BRANCH='"${{ github.ref_name }}"' \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework Metal \
            -framework CoreText \
            -framework ImageIO \
            -framework UniformTypeIdentifiers \
            -framework Security \
            -framework CoreLocation \
            -lcompression \
            -lc++ \
            -stdlib=libc++ \
            -install_name "@rpath/ZSingularity.dylib" \
            -Wl,-ld_classic \
            -Wl,-sectcreate,__DATA,__enkephalin,Resources/Enkephalin.gif \
            -I. \
            -ICore -IUI -IMods -IMods/BundleTools -IMods/Transcoder -Iastcenc-src/Source -INetwork -IDiagnostics -IResources -INotifications \
            Mods/BundleTools/UnityBundleTools.m \
            Core/IL2CppIntrospection.m \
            Dumper/ZSDumper.m \
            Core/ZSDumpTypeRegistry.m \
            Core/ZSEngine.m \
            Diagnostics/ZSDiagnostics.m \
            Mods/Mods.m \
            Mods/Transcoder/Transcoder.m \
            Mods/Transcoder/ZSLowRes.m \
            Network/PatchManifestNetwork.m \
            Network/ZSUpdater.m \
            UI/UserInterface.m \
            UI/ZSGifTint.m \
            lz4.c \
            lz4hc.c \
            astcenc-obj/*.o \
            -o ZSingularity.dylib

      - name: Ad-hoc codesign
        run: codesign -f -s - ZSingularity.dylib

      - name: Verify architecture
        run: lipo -info ZSingularity.dylib

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          
          # Delete existing nightly release and wait for completion
          if gh release view nightly --repo "$REPO" > /dev/null 2>&1; then
            gh release delete nightly --repo "$REPO" --yes --cleanup-tag
            sleep 2  # Wait for API to process deletion
          fi
          
          # Create new nightly release
          gh release create nightly ZSingularity.dylib \
            --repo "$REPO" \
            --title "Nightly build ${{ github.run_number }}" \
            --notes "Automated nightly build ${{ github.run_number }} (commit ${{ github.sha }})." \
            --prerelease \
            --target "${{ github.sha }}"
