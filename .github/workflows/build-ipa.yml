name: Build Injected IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct download link to the .ipa'
        type: string
      dylib_channel:
        description: 'Select channel'
        type: choice
        required: true
        options:
          - latest
          - nightly

jobs:
  build-ipa:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cached .ipa
        id: ipa-restore
        uses: actions/cache/restore@v4
        with:
          path: ipa/app.ipa
          key: ipa-${{ github.run_id }}
          restore-keys: |
            ipa-

      - name: Download or reuse cached .ipa
        id: get-ipa
        run: |
          set -euo pipefail
          mkdir -p ipa

          URL="${{ inputs.ipa_url }}"

          if [[ -n "$URL" ]]; then
            echo "Input URL provided — downloading fresh .ipa"
            curl -fL --retry 3 --retry-all-errors "$URL" -o ipa/app.ipa

            if [[ ! -s ipa/app.ipa ]] || ! head -c 2 ipa/app.ipa | grep -q "PK"; then
              echo "::error::Downloaded file is empty or not a valid .ipa/zip archive. Check the direct download link." >&2
              exit 1
            fi

            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No URL provided — falling back to cached .ipa"
            if [[ "${{ steps.ipa-restore.outputs.cache-hit }}" != "true" || ! -s ipa/app.ipa ]]; then
              echo "::error::No ipa_url was given and no cached .ipa exists yet. Run the workflow once with ipa_url set." >&2
              exit 1
            fi
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save .ipa to cache
        if: steps.get-ipa.outputs.downloaded == 'true'
        uses: actions/cache/save@v4
        with:
          path: ipa/app.ipa
          key: ipa-${{ github.run_id }}

      - name: Resolve dylib release tag
        id: dylib-tag
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dylib_channel }}" == "nightly" ]]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download dylib from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download ${{ steps.dylib-tag.outputs.tag }} \
            --repo "${{ github.repository }}" \
            --pattern 'ZSingularity.dylib' \
            --dir . \
            --clobber

          if [[ ! -s ZSingularity.dylib ]]; then
            echo "::error::Couldn't find a ZSingularity.dylib asset on the '${{ inputs.dylib_channel }}' release." >&2
            exit 1
          fi

      - name: Resolve tweak version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ inputs.dylib_channel }}
        run: |
          set -euo pipefail
          TWEAK_VERSION=""

          if [[ "$CHANNEL" == "nightly" ]]; then
            REF="$(gh release view nightly --repo "$REPO" --json targetCommitish -q .targetCommitish || true)"
            HEADER=""
            if [[ -n "$REF" ]]; then
              HEADER="$(gh api "repos/$REPO/contents/Core/ZSVersion.h?ref=$REF" -H 'Accept: application/vnd.github.raw' || true)"
            fi
            if [[ -z "$HEADER" ]]; then
              HEADER="$(cat Core/ZSVersion.h)"
            fi
            part() { printf '%s' "$HEADER" | grep -oE "#define ZS_VERSION_$1 [0-9]+" | grep -oE '[0-9]+$'; }
            TWEAK_VERSION="$(part MAJOR).$(part MINOR).$(part PATCH)"
          else
            TAG_NAME="$(gh release view --repo "$REPO" --json tagName -q .tagName)"
            TWEAK_VERSION="${TAG_NAME#v}"
          fi

          if [[ -z "$TWEAK_VERSION" ]]; then
            echo "::error::Could not determine the tweak version." >&2
            exit 1
          fi
          echo "TWEAK_VERSION=$TWEAK_VERSION" >> "$GITHUB_ENV"

      - name: Ad-hoc codesign
        run: codesign -f -s - ZSingularity.dylib

      - name: Verify architecture
        run: lipo -info ZSingularity.dylib

      - name: Extract .ipa
        run: |
          set -euo pipefail
          rm -rf ipa/extracted
          mkdir -p ipa/extracted
          unzip -q ipa/app.ipa -d ipa/extracted

          APP_DIR="$(find ipa/extracted/Payload -maxdepth 1 -iname '*.app' | head -n1)"
          if [[ -z "$APP_DIR" ]]; then
            echo "::error::Could not find a .app bundle inside Payload/ — is this a valid .ipa?" >&2
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Read game version
        run: |
          set -euo pipefail
          GAME_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Info.plist")"
          if [[ -z "$GAME_VERSION" ]]; then
            echo "::error::CFBundleShortVersionString is missing from the game's Info.plist." >&2
            exit 1
          fi
          echo "GAME_VERSION=$GAME_VERSION" >> "$GITHUB_ENV"

      - name: Copy dylib into app bundle
        run: |
          set -euo pipefail
          mkdir -p "$APP_DIR/Frameworks"
          cp ZSingularity.dylib "$APP_DIR/Frameworks/ZSingularity.dylib"

          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_DIR/Info.plist")"
          echo "MAIN_BINARY=$APP_DIR/$EXECUTABLE_NAME" >> "$GITHUB_ENV"

      - name: Patch Info.plist keys
        run: |
          set -euo pipefail
          PLIST="$APP_DIR/Info.plist"
          for key in CADisableMinimumFrameDuration CADisableMinimumFrameDurationOnPhone LSSupportsGameMode LSSupportsOpeningDocumentsInPlace UIFileSharingEnabled; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$key bool true" "$PLIST"
          done

          for key in NSLocationWhenInUseUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$key string 'Used by the Keep Alive developer tool to prevent suspension during testing.'" "$PLIST"
          done

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"

      - name: Install injection tooling
        run: python3 -m pip install --quiet --break-system-packages lief

      - name: Insert LC_LOAD_DYLIB into main executable
        run: |
          python3 - <<'PYEOF'
          import os, sys
          import lief

          binary_path = os.environ["MAIN_BINARY"]
          dylib_ref = "@executable_path/Frameworks/ZSingularity.dylib"

          fat = lief.MachO.parse(binary_path)
          if fat is None or len(fat) == 0:
              sys.exit(f"Failed to parse main executable at {binary_path}")

          for binary in fat:
              # Check if library already exists by examining load commands
              already_loaded = any(
                  lib.name == dylib_ref 
                  for lib in binary.libraries
              )
              if not already_loaded:
                  binary.add_library(dylib_ref)

          fat.write(binary_path)
          print(f"Injected {dylib_ref} into {binary_path}")
          PYEOF

      - name: Re-sign app bundle (ad-hoc)
        run: |
          set -euo pipefail
          chmod +x "$MAIN_BINARY"
          codesign -f -s - "$APP_DIR/Frameworks/ZSingularity.dylib"
          codesign -f -s - --deep --preserve-metadata=entitlements "$APP_DIR"

      - name: Repackage .ipa
        run: |
          set -euo pipefail
          OUT_IPA="LC${GAME_VERSION}—ZS${TWEAK_VERSION}.ipa"
          pushd ipa/extracted
          rm -f "../../$OUT_IPA"
          zip -qry "../../$OUT_IPA" Payload
          popd
          echo "OUT_IPA=$OUT_IPA" >> "$GITHUB_ENV"

      - name: Publish injected .ipa as a GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="ipa"
          TITLE="LimbusCompany v${GAME_VERSION} — ZS v${TWEAK_VERSION}"
          NOTES="ZSingularity v${TWEAK_VERSION} injected into LimbusCompany v${GAME_VERSION} (build ${{ github.run_number }}, commit ${{ github.sha }})."

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | while IFS= read -r NAME; do
              if [[ "$NAME" == *.ipa ]]; then
                gh release delete-asset "$TAG" "$NAME" --repo "$REPO" --yes
              fi
            done
            gh release edit "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
            gh release upload "$TAG" "$OUT_IPA" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$OUT_IPA" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --target "${{ github.sha }}"
          fi

          URL="$(gh release view "$TAG" --repo "$REPO" --json url -q .url)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Validate Discord webhook
        id: webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ "$DISCORD_WEBHOOK_URL" =~ ^https://(www\.|ptb\.|canary\.)?(discord|discordapp)\.com/api(/v[0-9]+)?/webhooks/[0-9]+/[A-Za-z0-9._-]+/?$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post release link to Discord
        if: steps.webhook.outputs.valid == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          CONTENT="$(printf 'LimbusCompany v%s\nZS v%s\n\n%s' "$GAME_VERSION" "$TWEAK_VERSION" "$RELEASE_URL")"
          PAYLOAD="$(jq -n --arg content "$CONTENT" '{content: $content}')"
          curl -fsS --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" > /dev/null
