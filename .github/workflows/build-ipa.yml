name: Build Injected IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct download link to the .ipa'
        type: string

env:
  LZ4_REF: v1.10.0

jobs:
  build-ipa:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cached .ipa
        id: ipa-restore
        uses: actions/cache/restore@v4
        with:
          path: ipa/app.ipa
          key: ipa-${{ github.run_id }}
          restore-keys: |
            ipa-

      - name: Download or reuse cached .ipa
        id: get-ipa
        run: |
          set -euo pipefail
          mkdir -p ipa

          URL="${{ inputs.ipa_url }}"

          if [[ -n "$URL" ]]; then
            echo "Input URL provided — downloading fresh .ipa"
            curl -fL --retry 3 --retry-all-errors "$URL" -o ipa/app.ipa

            if [[ ! -s ipa/app.ipa ]] || ! head -c 2 ipa/app.ipa | grep -q "PK"; then
              echo "::error::Downloaded file is empty or not a valid .ipa/zip archive. Check the direct download link." >&2
              exit 1
            fi

            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No URL provided — falling back to cached .ipa"
            if [[ "${{ steps.ipa-restore.outputs.cache-hit }}" != "true" || ! -s ipa/app.ipa ]]; then
              echo "::error::No ipa_url was given and no cached .ipa exists yet. Run the workflow once with ipa_url set." >&2
              exit 1
            fi
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save .ipa to cache
        if: steps.get-ipa.outputs.downloaded == 'true'
        uses: actions/cache/save@v4
        with:
          path: ipa/app.ipa
          key: ipa-${{ github.run_id }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve iOS SDK path
        id: sdk
        run: echo "path=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_OUTPUT"

      - name: Cache LZ4 reference library
        id: lz4-cache
        uses: actions/cache@v4
        with:
          path: |
            lz4.h
            lz4.c
            lz4hc.h
            lz4hc.c
            lz4-checksums.txt
          key: lz4-${{ env.LZ4_REF }}

      - name: Fetch LZ4 reference library
        if: steps.lz4-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/lz4/lz4/${LZ4_REF}/lib"
          for f in lz4.h lz4.c lz4hc.h lz4hc.c; do
            curl -fsSL "${BASE}/${f}" -o "$f"
          done
          shasum -a 256 lz4.h lz4.c lz4hc.h lz4hc.c > lz4-checksums.txt
          shasum -a 256 -c lz4-checksums.txt

      - name: Verify cached LZ4 checksums
        if: steps.lz4-cache.outputs.cache-hit == 'true'
        run: shasum -a 256 -c lz4-checksums.txt

      - name: Compile tweak dylib
        run: |
          clang \
            -dynamiclib \
            -O2 \
            -fobjc-arc \
            -fmodules \
            -isysroot "${{ steps.sdk.outputs.path }}" \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -DZS_BUILD_NUMBER=${{ github.run_number }} \
            -DZS_BUILD_CHANNEL=ipa \
            -DZS_BUILD_BRANCH='"${{ github.ref_name }}"' \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreText \
            -framework ImageIO \
            -framework UniformTypeIdentifiers \
            -framework Security \
            -lcompression \
            -lc++ \
            -stdlib=libc++ \
            -install_name "@rpath/ZSingularity.dylib" \
            -Wl,-ld_classic \
            -Wl,-sectcreate,__DATA,__enkephalin,Resources/Enkephalin.gif \
            -I. \
            -ICore -IUI -IMods -IBundleTools -ITranscoder -INetwork -IDiagnostics -IResources -INotifications \
            BundleTools/UnityBundleTools.m \
            Core/IL2CppIntrospection.m \
            Core/ZSDumpTypeRegistry.m \
            Core/ZSEngine.m \
            Core/ZSInfoPlistPatch.m \
            Diagnostics/ZSDiagnostics.m \
            Mods/BankTransplant.m \
            Mods/ModAssetManagement.m \
            Network/PatchManifestNetwork.m \
            Network/ZSUpdater.m \
            Transcoder/Transcoder.m \
            UI/UserInterface.m \
            UI/ZSGifTint.m \
            lz4.c \
            lz4hc.c \
            -o ZSingularity.dylib

      - name: Ad-hoc codesign
        run: codesign -f -s - ZSingularity.dylib

      - name: Verify architecture
        run: lipo -info ZSingularity.dylib

      - name: Extract .ipa
        run: |
          set -euo pipefail
          rm -rf ipa/extracted
          mkdir -p ipa/extracted
          unzip -q ipa/app.ipa -d ipa/extracted

          APP_DIR="$(find ipa/extracted/Payload -maxdepth 1 -iname '*.app' | head -n1)"
          if [[ -z "$APP_DIR" ]]; then
            echo "::error::Could not find a .app bundle inside Payload/ — is this a valid .ipa?" >&2
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Copy dylib into app bundle
        run: |
          set -euo pipefail
          mkdir -p "$APP_DIR/Frameworks"
          cp ZSingularity.dylib "$APP_DIR/Frameworks/ZSingularity.dylib"

          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_DIR/Info.plist")"
          echo "MAIN_BINARY=$APP_DIR/$EXECUTABLE_NAME" >> "$GITHUB_ENV"

      - name: Patch Info.plist keys
        run: |
          set -euo pipefail
          PLIST="$APP_DIR/Info.plist"
          for key in CADisableMinimumFrameDuration CADisableMinimumFrameDurationOnPhone LSSupportsGameMode LSSupportsOpeningDocumentsInPlace UIFileSharingEnabled; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$key bool true" "$PLIST"
          done

      - name: Install injection tooling
        run: python3 -m pip install --quiet --break-system-packages lief

      - name: Insert LC_LOAD_DYLIB into main executable
        run: |
          python3 - <<'PYEOF'
          import os, sys
          import lief

          binary_path = os.environ["MAIN_BINARY"]
          dylib_ref = "@executable_path/Frameworks/ZSingularity.dylib"

          fat = lief.MachO.parse(binary_path)
          if fat is None or len(fat) == 0:
              sys.exit(f"Failed to parse main executable at {binary_path}")

          for binary in fat:
              if not any(lib.name == dylib_ref for lib in binary.libraries):
                  binary.add_library(dylib_ref)

          fat.write(binary_path)
          print(f"Injected {dylib_ref} into {binary_path}")
          PYEOF

      - name: Re-sign app bundle (ad-hoc)
        run: |
          set -euo pipefail
          chmod +x "$MAIN_BINARY"
          codesign -f -s - "$APP_DIR/Frameworks/ZSingularity.dylib"
          codesign -f -s - --deep --preserve-metadata=entitlements "$APP_DIR"

      - name: Repackage .ipa
        run: |
          set -euo pipefail
          OUT_IPA="ZSingularity-Injected.ipa"
          pushd ipa/extracted
          rm -f "../../$OUT_IPA"
          zip -qry "../../$OUT_IPA" Payload
          popd
          echo "OUT_IPA=$OUT_IPA" >> "$GITHUB_ENV"

      - name: Publish injected .ipa as a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ipa-${{ github.run_number }}"
          gh release create "$TAG" "$OUT_IPA" \
            --repo "${{ github.repository }}" \
            --title "Injected IPA build ${{ github.run_number }}" \
            --notes "ZSingularity injected into the provided .ipa (build ${{ github.run_number }}, commit ${{ github.sha }})." \
            --prerelease \
            --target "${{ github.sha }}"
